<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lab-6-4</title>
</head>
<body>
    <form>

        <table>
            <tr>
                <td>
                    Name:
                </td>
                <td>
                    <input type="text" name="name" 
                    required>
                </td>
            </tr>
            <tr>
                <td>
                    Email:
                </td>
                <td>
                    <input type="email" name="email" pattern="[a-Z][0-9]@[.]" required>
                </td>
            </tr>
            <tr>
                <td>
                    Password:
                </td>
                <td>
                    <input type="password" name="password" pattern="[a-zA-Z0-9]{8}" required>
                </td>
            </tr>
            <tr>
                <td>
                    Number:
                </td>
                <td>
                    <input type="tel" name="phone" pattern="[6-9][0-9]{9}" required>
                </td>
            </tr>
            <tr>
            <td colspan="2">
                <input type="submit">
            </td>
            </tr>
        </table>
    </form>
</body>
</html>
