<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>lab-6-5</title>
</head>
<body>
    Feedback Form
    <form>
        <table>

            <tr>
                <td>Name:</td>
                <td>
                    <input type="text" name="name">
                </td>
            </tr>
            <tr>
                <td>Email:</td>
                <td>
                    <input type="email" name="mail">
                </td>
            </tr>
            <tr>
                <td>
                    Rating:
                </td>
                <td>
                    <input type="number" name="rate" min="1" max="5" minlength="1" maxlength="1" required>
                </td>
            </tr>
            <tr>
                <td>Feedback:</td>
                <td>
                    <textarea name="feedback" placeholder="Your Feedback Here."></textarea>
                </td>
            </tr>
            <tr>
                <td ><input type="submit" value="Submit Form"></td>
            </tr>
        </table>
    </form>

</body>
</html>
