<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>lab 8-1</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        header {
            height: 10vh;
            width: 100%;
            display: flex;

            & div {
                flex: 1;
                display: flex;
                justify-content: center;
                align-items: center;
                border: solid red;
            }

            & nav {
                flex: 4;
                width: 100%;
                display: flex;
                justify-content: left;
                padding-left: 0.5rem;
                gap: 10px;
                align-items: center;
                border: solid blue;
            }
        }

        main {
            display: flex;
            width: 100%;
            height: 80vh;

            & #sidebar {
                flex: 1;
                display: flex;
                flex-direction: column;
                border: solid orange;
                padding: 2%;

                & div {
                    text-align: center;
                    width: 100%;
                    margin-bottom: 5%;
                    padding: 5%;
                    border: solid;
                }
            }

            & #content {
                flex: 3;
                display: flex;
                flex-direction: column;
                row-gap: 5%;
                justify-content: center;
                border: solid green;
                padding: 2%;

                & .boxes {
                    width: 100%;
                    border: solid purple;
                    display: flex;
                    padding: 4%;
                    justify-content: space-evenly;
                    align-content: stretch;
                }
            }

            .small-box {
                flex-grow: 1;
                min-height: 100px;
                max-width: 200px;
                border: dotted red;
            }
        }

        footer {
            display: flex;
            height: 10vh;
            width: 100%;
            align-items: center;
            justify-content: center;
            border: solid blue;
        }
    </style>
</head>

<body>
    <header>
        <div>
            logo here
        </div>
        <nav>
            <a href="#">Home</a>
            <a href="#">About</a>
            <a href="#">Contact</a>
        </nav>
    </header>
    <main>
        <div id="sidebar">
            <div>RESULT</div>
            <div>APPLY</div>
            <div>PLACEMENT</div>
            <div>RECRUTMENT</div>
            <div>NEWS</div>
        </div>
        <div id="content">
            <div class="boxes">
                <div class="small-box"></div>
                <div class="small-box"></div>
            </div>
            <div class="boxes">
                <div class="small-box"></div>
                <div class="small-box"></div>
                <div class="small-box"></div>
            </div>
        </div>
    </main>
    <footer>
        Footer
    </footer>
</body>

</html>
